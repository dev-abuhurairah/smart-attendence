name: Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APK (requires signing secrets)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  ci-debug:
    name: Test, Lint & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Debug APK
        id: assemble_debug
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build_debug.log

      - name: Run Unit Tests
        id: unit_tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test_debug.log

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Build Reports and Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-reports
          path: |
            *.log
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish Logs to Git Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs 2>/dev/null || git checkout -B build-logs
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p logs
          cp *.log logs/ 2>/dev/null || true
          echo "Status: ${{ job.status }}" > logs/status.txt
          echo "Commit: ${{ github.sha }}" >> logs/status.txt
          git add logs/
          git commit -m "Build logs for ${{ github.sha }} [skip ci]" || true
          git push -f origin build-logs || true

      - name: Publish Debug APK to Git Branch
        if: success()
        run: |
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            git checkout --orphan apk-download 2>/dev/null || git checkout -B apk-download
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p apk
            cp app/build/outputs/apk/debug/*.apk apk/smart-attendance-debug.apk
            git add apk/
            git commit -m "Debug APK for ${{ github.sha }} [skip ci]" || true
            git push -f origin apk-download || true
          fi

      - name: Create or Update GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: "Smart Attendance v1.0.0 (Debug Build)"
          body: |
            ### Smart Attendance Android App
            Automated debug APK build from commit `${{ github.sha }}`.

            Download `smart-attendance-debug.apk` below and install on your Android device.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Signed Release APK
    needs: ci-debug
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Aborting release build."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Clean Up Keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-release-apk
          path: app/build/outputs/apk/release/*.apk
